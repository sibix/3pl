
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Booomi Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#242F3F;
    --cream:#F2EFE6;
    --cream-dim:#E7E2D3;
    --orange:#FF6A13;
    --orange-dim:#D9560C;
    --steel:#8A93A3;
    --line: rgba(242,239,230,0.14);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:
      radial-gradient(circle at 50% 0%, #26313f 0%, var(--ink) 55%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* subtle warehouse floor texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(242,239,230,0.025) 0px, rgba(242,239,230,0.025) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, rgba(242,239,230,0.025) 0px, rgba(242,239,230,0.025) 1px, transparent 1px, transparent 64px);
    z-index:0;
  }

  .app-shell{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 20px 40px;
  }

  /* ---- Top bar ---- */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:28px 0 22px;
  }

  .mark{
    width:44px;
    height:44px;
    border-radius:10px;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 6px 16px rgba(255,106,19,0.25);
  }
  .mark svg{width:24px; height:24px;}

  .brand{
    display:flex;
    flex-direction:column;
    line-height:1.05;
  }
  .brand-name{
    font-family:'Archivo Black', sans-serif;
    font-size:19px;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .brand-name .accent{color:var(--orange);}
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    color:var(--steel);
    text-transform:uppercase;
    margin-top:3px;
  }

  .status-chip{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:#8CD9A0;
    background:rgba(140,217,160,0.1);
    border:1px solid rgba(140,217,160,0.35);
    padding:5px 9px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .status-chip::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:#8CD9A0;
    box-shadow:0 0 6px #8CD9A0;
  }

  /* ---- Hero strip ---- */
  .hero{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .hero-text .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--orange);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .hero-text h1{
    font-family:'Archivo Black', sans-serif;
    font-size:16px;
    font-weight:400;
    line-height:1.3;
    max-width:280px;
  }
  .hero-barcode{
    display:flex;
    gap:2px;
    align-items:flex-end;
    height:34px;
    opacity:0.85;
    flex-shrink:0;
  }
  .hero-barcode span{
    display:block;
    width:2px;
    background:var(--cream);
  }

  /* ---- Section label ---- */
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--steel);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  /* ---- Tile grid ---- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .tile{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:16px;
    padding:18px 16px 16px;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    min-height:168px;
    overflow:hidden;
    isolation:isolate;
    transform:translateY(0);
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 1px 0 rgba(0,0,0,0.05), 0 10px 24px rgba(0,0,0,0.28);
  }
  .tile:active{ transform:translateY(2px) scale(0.98); }

  @media(hover:hover){
    .tile:hover{
      transform:translateY(-3px);
      box-shadow:0 1px 0 rgba(0,0,0,0.05), 0 16px 32px rgba(0,0,0,0.36);
    }
    .tile:hover .tile-icon{ transform:rotate(-4deg) scale(1.05); }
  }

  /* corner peel / tape notch, the signature detail */
  .tile::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width:26px; height:26px;
    background:
      linear-gradient(135deg, transparent 50%, var(--ink) 50.5%),
      linear-gradient(135deg, rgba(0,0,0,0.12) 0%, transparent 60%);
    z-index:2;
  }

  .tile-index{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--orange-dim);
    margin-bottom:auto;
  }

  .tile-icon{
    width:40px; height:40px;
    margin:10px 0 14px;
    transition:transform .18s ease;
  }
  .tile-icon svg{width:100%; height:100%;}

  .tile-name{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:15px;
    line-height:1.25;
    letter-spacing:-0.01em;
  }

  .tile-barcode{
    display:flex;
    gap:1.5px;
    align-items:flex-end;
    height:14px;
    margin-top:10px;
    opacity:0.55;
  }
  .tile-barcode span{
    display:block;
    width:1.5px;
    background:var(--ink);
  }

  /* ---- Footer ---- */
  .footer{
    margin-top:30px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--steel);
    text-transform:uppercase;
  }

  /* ---- Desktop / larger viewport ---- */
  @media (min-width:720px){
    .app-shell{
      max-width:880px;
      padding:0 40px 60px;
    }
    .topbar{ padding:40px 0 30px; }
    .mark{ width:52px; height:52px; border-radius:12px; }
    .mark svg{ width:28px; height:28px; }
    .brand-name{ font-size:24px; }
    .brand-sub{ font-size:11.5px; }
    .hero{ padding:22px 26px; margin-bottom:34px; }
    .hero-text h1{ font-size:19px; max-width:420px; }
    .grid{
      grid-template-columns:repeat(4, 1fr);
      gap:20px;
    }
    .tile{ min-height:210px; padding:22px 20px 20px; border-radius:18px; }
    .tile-icon{ width:46px; height:46px; margin:14px 0 18px; }
    .tile-name{ font-size:17px; }
  }

  @media (min-width:1080px){
    .app-shell{ max-width:1040px; }
  }

  :focus-visible{
    outline:2px solid var(--orange);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .tile, .tile-icon{ transition:none; }
  }
</style>
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 8L12 4L20 8V16L12 20L4 16V8Z" stroke="#1B2430" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M4 8L12 12L20 8" stroke="#1B2430" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 12V20" stroke="#1B2430" stroke-width="1.8"/>
      </svg>
    </div>
    <div class="brand">
      <span class="brand-name">Booomi<span class="accent">·</span>Connect</span>
      <span class="brand-sub">3PL Ops Toolkit</span>
    </div>
    <span class="status-chip">Online</span>
  </div>

  <div class="hero">
    <div class="hero-text">
      <div class="eyebrow">Dock &nbsp;04 — Ready</div>
      <h1>Pick a tool to get moving.</h1>
    </div>
    <div class="hero-barcode" aria-hidden="true">
      <span style="height:60%"></span><span style="height:100%"></span><span style="height:40%"></span>
      <span style="height:80%"></span><span style="height:55%"></span><span style="height:100%"></span>
      <span style="height:30%"></span><span style="height:70%"></span><span style="height:90%"></span>
      <span style="height:45%"></span>
    </div>
  </div>

  <div class="section-label">Tools</div>

  <div class="grid">

    <a class="tile" href="https://sibix.github.io/3pl/scan/" target="_blank" rel="noopener">
      <span class="tile-index">01 / SCAN</span>
      <div class="tile-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M6 12V7a1 1 0 0 1 1-1h5" stroke="#1B2430" stroke-width="2" stroke-linecap="round"/>
          <path d="M34 12V7a1 1 0 0 0-1-1h-5" stroke="#1B2430" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 28v5a1 1 0 0 0 1 1h5" stroke="#1B2430" stroke-width="2" stroke-linecap="round"/>
          <path d="M34 28v5a1 1 0 0 1-1 1h-5" stroke="#1B2430" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="20" x2="36" y2="20" stroke="#FF6A13" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="11" y1="14" x2="11" y2="26" stroke="#1B2430" stroke-width="1.6"/>
          <line x1="15" y1="14" x2="15" y2="26" stroke="#1B2430" stroke-width="2.6"/>
          <line x1="19" y1="14" x2="19" y2="26" stroke="#1B2430" stroke-width="1.6"/>
          <line x1="23" y1="14" x2="23" y2="26" stroke="#1B2430" stroke-width="2.6"/>
          <line x1="27" y1="14" x2="27" y2="26" stroke="#1B2430" stroke-width="1.6"/>
        </svg>
      </div>
      <span class="tile-name">SCAN</span>
      <div class="tile-barcode" aria-hidden="true">
        <span style="height:100%"></span><span style="height:50%"></span><span style="height:80%"></span>
        <span style="height:35%"></span><span style="height:90%"></span><span style="height:60%"></span>
        <span style="height:100%"></span><span style="height:45%"></span>
      </div>
    </a>

    <a class="tile" href="https://sibix.github.io/3pl/pdf/reorder/" target="_blank" rel="noopener">
      <span class="tile-index">02 / LBL</span>
      <div class="tile-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="8" y="7" width="18" height="12" rx="1.5" stroke="#1B2430" stroke-width="2"/>
          <rect x="14" y="21" width="18" height="12" rx="1.5" stroke="#1B2430" stroke-width="2"/>
          <path d="M9 24 L5 24 L5 30 L9 30" stroke="#FF6A13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 21 L9 24 L6 27" stroke="#FF6A13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="tile-name">Reorder Labels</span>
      <div class="tile-barcode" aria-hidden="true">
        <span style="height:70%"></span><span style="height:100%"></span><span style="height:40%"></span>
        <span style="height:85%"></span><span style="height:55%"></span><span style="height:100%"></span>
        <span style="height:30%"></span><span style="height:75%"></span>
      </div>
    </a>

    <a class="tile" href="https://sibix.github.io/3pl/pdf/4x3/" target="_blank" rel="noopener">
      <span class="tile-index">03 / GRID</span>
      <div class="tile-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="6" y="6" width="9" height="9" rx="1.2" stroke="#1B2430" stroke-width="2"/>
          <rect x="22" y="6" width="9" height="9" rx="1.2" stroke="#FF6A13" stroke-width="2"/>
          <rect x="6" y="22" width="9" height="9" rx="1.2" stroke="#FF6A13" stroke-width="2"/>
          <rect x="22" y="22" width="9" height="9" rx="1.2" stroke="#1B2430" stroke-width="2"/>
        </svg>
      </div>
      <span class="tile-name">A4&nbsp;·&nbsp;8 Grid</span>
      <div class="tile-barcode" aria-hidden="true">
        <span style="height:90%"></span><span style="height:60%"></span><span style="height:100%"></span>
        <span style="height:40%"></span><span style="height:70%"></span><span style="height:95%"></span>
        <span style="height:50%"></span><span style="height:80%"></span>
      </div>
    </a>

    <a class="tile" href="https://sibix.github.io/3pl/cpdp/excel/" target="_blank" rel="noopener">
      <span class="tile-index">04 / CPDP</span>
      <div class="tile-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="6" y="6" width="28" height="28" rx="2" stroke="#1B2430" stroke-width="2"/>
          <line x1="6" y1="15" x2="34" y2="15" stroke="#1B2430" stroke-width="1.6"/>
          <line x1="6" y1="23" x2="34" y2="23" stroke="#1B2430" stroke-width="1.6"/>
          <line x1="17" y1="6" x2="17" y2="34" stroke="#1B2430" stroke-width="1.6"/>
          <path d="M22 19.5L26 19.5L26 27.5L22 27.5" stroke="#FF6A13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 23.5L30 23.5" stroke="#FF6A13" stroke-width="2" stroke-linecap="round"/>
          <path d="M27.5 20.5L30 23.5L27.5 26.5" stroke="#FF6A13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="tile-name">CPDP Address → Excel</span>
      <div class="tile-barcode" aria-hidden="true">
        <span style="height:60%"></span><span style="height:100%"></span><span style="height:50%"></span>
        <span style="height:80%"></span><span style="height:35%"></span><span style="height:100%"></span>
        <span style="height:65%"></span><span style="height:90%"></span>
      </div>
    </a>

  </div>

  <div class="footer">Booomi Connect — 3PL IQ</div>

</div>

</body>
</html>
